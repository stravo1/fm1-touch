# Test, build the page over the upstream emulator's wasm, and publish it on GitHub Pages.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Tests
        run: ./test.sh

      - name: Build the site
        run: ./build.sh _site

      # The wasm boots a real firmware to audio and a screen, and a MIDI note sounds.
      - name: Smoke test
        run: node upstream/web/smoke.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
