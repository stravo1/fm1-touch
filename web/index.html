<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FM-1 Touch</title>
<meta name="description" content="The M-VAVE FM-1 pocket synth, emulated in the browser, made for touch screens.">
<meta name="theme-color" content="#18191b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <canvas id="panel" aria-label="FM-1 front panel"></canvas>
</main>

<button type="button" id="gear" class="button icon-only ghost" aria-label="Settings"><span data-icon="sliders-horizontal" data-size="20"></span></button>

<div id="perfwarn" class="alert" role="alert" hidden>
  <span data-icon="triangle-alert" class="alert-icon"></span>
  <div class="alert-body">
    <p id="perfwarn-text"></p>
    <div class="row">
      <button type="button" id="perfwarn-fix" class="button solid"></button>
      <button type="button" id="perfwarn-copy" class="button subtle">Copy a report</button>
    </div>
  </div>
  <button type="button" id="perfwarn-close" class="button icon-only ghost" aria-label="Dismiss"><span data-icon="x"></span></button>
</div>

<div id="update" class="alert info" role="status" hidden>
  <span data-icon="refresh-cw" class="alert-icon"></span>
  <p class="alert-body">A new version is ready.</p>
  <button type="button" id="update-reload" class="button solid">Reload</button>
</div>

<section id="sheet" class="dialog" aria-labelledby="title">
  <header class="dialog-head">
    <h1 id="title">FM-1</h1>
    <button type="button" id="sheet-close" class="button icon-only ghost" aria-label="Close settings"><span data-icon="x"></span></button>
  </header>

  <div class="control">
    <span class="label" id="fw-label">Firmware</span>
    <select id="fw" aria-labelledby="fw-label" data-combobox></select>
  </div>
  <button type="button" id="start" class="button solid large" disabled><span data-icon="play"></span>Start</button>

  <details>
    <summary><span data-icon="chevron-right" class="chevron"></span>More settings</summary>

    <div class="group">
      <div class="control">
        <span class="label"><label for="knob-sensitivity">Knob sensitivity</label><span id="knob-sensitivity-value" class="value"></span></span>
        <input type="range" id="knob-sensitivity" class="slider">
      </div>
      <label class="control switch-row">
        <span class="switch-text"><span class="text">Haptics</span><span class="hint">A tap of feedback on knob turns and button presses</span></span>
        <input type="checkbox" id="haptics" class="switch" role="switch">
      </label>
      <label class="control switch-row">
        <span class="switch-text"><span class="text">Key labels</span><span class="hint">The computer key for each control. [ and ] turn the chosen knob</span></span>
        <input type="checkbox" id="key-labels" class="switch" role="switch">
      </label>
    </div>

    <div class="group">
      <div class="control">
        <span class="label" id="accent-label">Color</span>
        <div id="accents" class="swatches" role="radiogroup" aria-labelledby="accent-label"></div>
      </div>
    </div>

    <div class="group">
      <p id="about" class="text"></p>
      <label class="control">
        <span class="label">Clock</span>
        <select id="mhz" class="input"></select>
      </label>
      <div class="row">
        <label class="button subtle file"><span data-icon="folder-open"></span>Open .fwsc <input type="file" id="open"></label>
        <label class="button subtle file"><span data-icon="music"></span>DX7 bank <input type="file" id="bank"></label>
        <button type="button" id="fullscreen" class="button subtle"><span data-icon="maximize"></span>Full screen</button>
      </div>
      <span id="bankname" class="hint"></span>
    </div>

    <div class="group">
      <h2 class="group-title">MIDI</h2>
      <div class="columns">
        <label class="control" id="midiin">
          <span class="label">Input <span id="midiact" aria-hidden="true"></span></span>
          <select id="midi" class="input"><option value="">off</option><option value="*">all inputs</option></select>
        </label>
        <label class="control">
          <span class="label">Channel</span>
          <select id="midich" class="input"><option value="0">as sent</option></select>
        </label>
      </div>
    </div>

    <div class="group">
      <h2 class="group-title">Saves</h2>
      <p id="save-status" class="hint" role="status" aria-live="polite">Start to restore saved settings and patches</p>
      <div class="row">
        <button type="button" id="save-now" class="button subtle"><span data-icon="save"></span>Save now</button>
        <button type="button" id="export-save" class="button subtle"><span data-icon="download"></span>Export</button>
        <label class="button subtle file"><span data-icon="upload"></span>Import <input type="file" id="import-save" accept=".json,.fm1save"></label>
        <button type="button" id="update-firmware" class="button subtle"><span data-icon="refresh-cw"></span>Check for updates</button>
        <button type="button" id="reset-save" class="button subtle danger"><span data-icon="rotate-ccw"></span>Reset flash</button>
      </div>
      <div class="row">
        <button type="button" id="browse-saves" class="button subtle"><span data-icon="history"></span>Saved firmwares</button>
        <select id="saved-versions" class="input grow" aria-label="Saved firmware versions"></select>
        <button type="button" id="open-saved-version" class="button subtle">Open</button>
      </div>
    </div>

    <div class="group">
      <p id="status" class="mono">Press Start to boot</p>
      <p class="hint">Based on <a href="https://github.com/joakimeriksson/fm1-emu">fm1-emu</a> by Joakim Eriksson (MIT).
        Firmwares download from their authors' sites. Not affiliated with M-VAVE.</p>
    </div>
  </details>
</section>

<div id="rotate" aria-live="polite">
  <span class="rotate-icon" data-icon="rotate-cw-square" data-size="64"></span>
  <p>Turn your device sideways to play.</p>
</div>

<script type="module" src="icons.js"></script>
<script type="module" src="accent.js"></script>
<script type="module" src="combobox.js"></script>
<script type="module" src="update.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
